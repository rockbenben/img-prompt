name: 🚀 Deploy website on push

on:
  push:
    branches:
      - main
    paths-ignore:
      - AGENTS.md
      - README.md
      - RELEASE.md
      - LICENSE

permissions:
  contents: write

concurrency:
  group: web-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.ftp_host }}
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Cache Next.js compiler
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}-${{ hashFiles('src/**', 'messages/**', 'public/**', 'next.config.*', 'tsconfig.json', 'postcss.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build website
        run: yarn build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 这是文档部署到的分支名称
          branch: gh-pages
          folder: out

      # 如果配置了 FTP 服务器密钥，才会执行本步骤，将页面静态文件同步到服务器
      - name: 📂 Sync files
        if: env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          local-dir: out/
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          port: ${{ secrets.ftp_port }} # 建议更改默认的 21 端口
          timeout: 600000
